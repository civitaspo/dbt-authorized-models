# Copy this workflow to civitaspo/securefix-server as:
#   .github/workflows/release-dbt-authorized-models.yml
# It is required for Release Tag labels with the release-dbt-auth- prefix.
name: Release dbt Authorized Models
run-name: Release dbt Authorized Models (${{ github.event.label.name }})

on:
  label:
    types:
      - created

permissions: {}

concurrency:
  group: release-dbt-auth-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.label.name, 'release-dbt-auth-')
    runs-on: ubuntu-latest
    environment: main
    permissions:
      issues: write
    timeout-minutes: 15

    steps:
      - name: Parse release request
        id: request
        env:
          DESCRIPTION: ${{ github.event.label.description }}
        run: |
          set -euo pipefail
          # Description formats:
          #   owner/repo/run_id
          #   owner/repo/run_id/tag
          #   owner/repo/run_id/tag/sha (preferred; sha is the tagged merge commit)
          repository=$(printf '%s' "$DESCRIPTION" | cut -d/ -f1-2)
          run_id=$(printf '%s' "$DESCRIPTION" | cut -d/ -f3)
          tag=$(printf '%s' "$DESCRIPTION" | cut -d/ -f4)
          expected_sha=$(printf '%s' "$DESCRIPTION" | cut -d/ -f5)

          if [ "$repository" != "civitaspo/dbt-authorized-models" ]; then
            echo "Denied client repository: $repository" >&2
            exit 1
          fi
          case "$run_id" in
            ''|*[!0-9]*)
              echo "Invalid workflow run ID" >&2
              exit 1
              ;;
          esac
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag in label description: $tag" >&2
            exit 1
          fi
          if [ -n "$expected_sha" ] && ! printf '%s' "$expected_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid commit SHA in label description: $expected_sha" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$DESCRIPTION" | awk -F/ '{print NF}')" -gt 5 ]; then
            echo "Invalid label description field count: $DESCRIPTION" >&2
            exit 1
          fi

          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Create client installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SECUREFIX_SERVER_APP_ID }}
          private-key: ${{ secrets.SECUREFIX_SERVER_PRIVATE_KEY }}
          owner: civitaspo
          repositories: dbt-authorized-models
          permission-actions: read
          permission-contents: write
          permission-pull-requests: read

      - name: Validate Release Tag workflow run
        id: validate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ steps.request.outputs.repository }}
          RUN_ID: ${{ steps.request.outputs.run_id }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
          REQUESTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          workflow_run=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID")

          printf '%s' "$workflow_run" | jq -e '
            .name == "Release Tag"
            and .repository.full_name == "civitaspo/dbt-authorized-models"
            and .head_repository.full_name == "civitaspo/dbt-authorized-models"
            and (
              .status == "in_progress"
              or .status == "queued"
              or (.status == "completed" and .conclusion == "success")
            )
          ' >/dev/null

          event=$(printf '%s' "$workflow_run" | jq -er '.event')
          head_sha=$(printf '%s' "$workflow_run" | jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))')
          tag=$REQUESTED_TAG
          if [ -z "$tag" ]; then
            head_branch=$(printf '%s' "$workflow_run" | jq -r '.head_branch // empty')
            if printf '%s' "$head_branch" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              tag=$head_branch
            fi
          fi
          if [ -z "$tag" ]; then
            echo "Release tag missing from label description and workflow head_branch" >&2
            exit 1
          fi

          expected_sha=$REQUESTED_SHA
          if [ -z "$expected_sha" ]; then
            case "$event" in
              pull_request)
                pulls=$(curl --fail --silent --show-error \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$REPOSITORY/commits/$head_sha/pulls")
                expected_sha=$(printf '%s' "$pulls" | jq -er '
                  map(select(
                    .base.ref == "main"
                    and .head.ref == "release/next"
                    and .merged_at != null
                    and (.merge_commit_sha | test("^[0-9a-f]{40}$"))
                  ))
                  | sort_by(.merged_at)
                  | reverse
                  | .[0].merge_commit_sha
                ')
                ;;
              workflow_dispatch)
                expected_sha=$head_sha
                ;;
              *)
                echo "Unsupported Release Tag event for SHA resolution: $event" >&2
                exit 1
                ;;
            esac
          fi
          if ! printf '%s' "$expected_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve expected release commit SHA" >&2
            exit 1
          fi

          echo "Allowed Release Tag run $RUN_ID for $REPOSITORY at $tag (expected $expected_sha)"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out package tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.validate.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is contained in main
        env:
          EXPECTED_SHA: ${{ steps.validate.outputs.expected_sha }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          test "$EXPECTED_SHA" = "$tag_commit"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ steps.request.outputs.repository }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Draft → publish once so immutable releases remain compatible.
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft
          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false

      - name: Delete release request label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          encoded_label=$(jq -rn --arg label "$LABEL_NAME" '$label | @uri')
          gh api --method DELETE "repos/${{ github.repository }}/labels/$encoded_label"
