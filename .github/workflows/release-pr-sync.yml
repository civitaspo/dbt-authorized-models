name: Release PR Sync

# securefix-action creates a release/next PR once, but does not update the
# title/body when later Release PR runs push new prepare commits. Sync metadata
# from .release-version after each push to release/next.

on:
  push:
    branches:
      - release/next
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@f0cd60319a245bc10c474de01fce3d89f5317ca2 # v0.1.0
