name: Release PR Sync

# securefix-action creates a release/next PR once, but does not update the
# title/body when later Release PR runs push new prepare commits. Sync metadata
# from .release-version after each push to release/next.

on:
  push:
    branches:
      - release/next
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@fbfe1e36ba343b0225dfe5681791799f75b02b96
