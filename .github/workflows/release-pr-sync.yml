name: Release PR Sync

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@cf98fd0d399b5951f8f8c4a6e06a48842d8b098f # v0.2.24
