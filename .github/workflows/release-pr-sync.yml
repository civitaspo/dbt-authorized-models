name: Release PR Sync

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@bf66565ea834e0fe528f4655806335740afd3348 # v0.2.46
