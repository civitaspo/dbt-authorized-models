name: Release PR Sync

# securefix-action creates a release/next PR once, but does not update the
# title/body when later Release PR runs push new prepare commits. Sync metadata
# from .release-version after each push to release/next.

on:
  push:
    branches:
      - release/next
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    name: sync release pull request metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5

    steps:
      - name: Check out release/next
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: release/next
          persist-credentials: false

      - name: Sync pull request title and body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < .release-version)
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid .release-version: ${version}" >&2
            exit 1
          fi

          pr_number=$(gh pr list \
            --head release/next \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open pull request for release/next; nothing to sync."
            exit 0
          fi

          body=$(
            printf '%s\n' \
              '## Summary' \
              "- Prepare release v${version}" \
              '- Update the changelog and release metadata' \
              '' \
              'This pull request is managed by the Release PR workflow.'
          )

          gh pr edit "$pr_number" \
            --title "chore(release): v${version}" \
            --body "$body"
          echo "Updated pull request #${pr_number} to v${version}."
