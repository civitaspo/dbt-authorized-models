name: Release PR Sync

on:
  # Managed release PR updates already synchronize their title and body.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@9865421823a451a8a7fe443e1896710971869fbc # v0.2.26
