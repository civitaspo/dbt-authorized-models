name: Release PR Sync

on:
  push:
    branches:
      - release/next
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
      attestations: read
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr-sync.yml@eb9845ad9a5897bef79a9a447eb2b6a2c1b678c1 # v0.1.0+eb9845ad9a5897bef79a9a447eb2b6a2c1b678c1
