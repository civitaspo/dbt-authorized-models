# Outermost PR entry: bind the pull_request event only.
# Which wc-* units run is decided in workflow_call_pr.yml.

name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

# Separate title edits from full CI so editing a title does not cancel in-flight test/lint.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event.action == 'edited' && 'title' || 'full'
    }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/workflow_call_pr.yml
    secrets: inherit

  status-check:
    name: status-check
    if: always() && !cancelled()
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require checks success
        run: |
          set -euo pipefail
          result="${{ needs.checks.result }}"
          echo "checks result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
