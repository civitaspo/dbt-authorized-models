name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/workflow_call_pr.yml
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    with:
      changed_title_only: false
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    permissions: {}
    needs:
      - checks
    steps:
      - name: Require successful checks
        env:
          JOB_RESULT: ${{ needs.checks.result }}
        run: test "$JOB_RESULT" = success
