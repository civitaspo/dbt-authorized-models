# Autofix (workflow_call). Used from workflow_call_pr.yml.

name: Autofix (workflow_call)

on:
  workflow_call:
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    timeout-minutes: 10
    env:
      SECUREFIX_CLIENT_APP_ID: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
      SECUREFIX_SERVER_REPOSITORY: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid CHANGELOG edits outside release/next
        if: github.head_ref != 'release/next'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "${base}...${head}" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is owned by the Release PR (git-cliff)." >&2
            echo "Do not edit it on feature PRs; use Conventional Commit subjects instead." >&2
            echo "See docs/releasing.md." >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.10.7"
          install_args: "--locked"
          cache: false

      - name: Fix action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify-comment

      - name: Disable checkout credentials
        run: disable-checkout-persist-credentials

      - name: ShellCheck release scripts
        if: hashFiles('scripts/**/*.sh') != ''
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Run ghalint
        run: ghalint run

      - name: Detect workflow fixes
        id: workflow-fixes
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only -- .github/workflows

      - name: Capture Securefix files
        id: securefix-files
        if: steps.workflow-fixes.outputs.changed == 'true'
        run: |
          git ls-files --modified --deleted --others --exclude-standard --deduplicate -z > "$RUNNER_TEMP/securefix-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/securefix-files"
          ((${#files[@]} > 0)) || { echo 'changed files are missing' >&2; exit 1; }
          for file in "${files[@]}"; do
          [[ "$file" != *$'\n'* && "$file" != *$'\r'* && "$file" != ' '* && "$file" != *' ' && "$file" != $'\t'* && "$file" != *$'\t' ]] || { echo 'changed file path cannot be represented' >&2; exit 1; }
          done
          delimiter=securefix-files
          while printf '%s\n' "${files[@]}" | grep -Fqx -- "$delimiter"; do delimiter="${delimiter}x"; done
          { printf 'files<<%s\n' "$delimiter"; printf '%s\n' "${files[@]}"; printf '%s\n' "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Create Securefix client token
        id: securefix-client-token
        if: "steps.workflow-fixes.outputs.changed == 'true' &&\nenv.SECUREFIX_CLIENT_APP_ID != ''\n"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "3872492"
          private-key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          owner: "civitaspo"
          repositories: "securefix-server"
          permission-issues: write

      - name: "Request SecureFix commit"
        if: "steps.workflow-fixes.outputs.changed == 'true' &&\nenv.SECUREFIX_CLIENT_APP_ID != ''\n"
        uses: "civitaspo/securefix-server/.github/actions/client@049293a67b703678ed78ee19c048e9ac5fed9cc3" # v0.2.6
        with:
          runtime-sha: 049293a67b703678ed78ee19c048e9ac5fed9cc3
          server-repository: "civitaspo/securefix-server"
          runtime-default-branch: "main"
          client-token: ${{ steps.securefix-client-token.outputs.token }}
          files: ${{ steps.securefix-files.outputs.files }}
          commit-message: "ci: apply workflow security fixes"

      - name: Require SecureFix configuration
        if: |
          steps.workflow-fixes.outputs.changed == 'true' &&
          env.SECUREFIX_CLIENT_APP_ID == ''
        run: |
          echo "Workflow security fixes are needed, but SECUREFIX_CLIENT_APP_ID is not configured." >&2
          exit 1
