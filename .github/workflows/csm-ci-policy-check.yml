name: csm-ci-policy-check
# Each event submits a separate request; callers do not cancel earlier requests.
# These workflows never check out PR code.
# jactionlint ignore=concurrency-limits,dangerous-triggers
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions: {}
jobs:
  request:
    # The called workflow mints the narrowly scoped Client App token.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/client-policy-check.yml@2b751e0f2e16bb8e7bdd57994a8d3e13cdb1879e
    secrets: inherit
