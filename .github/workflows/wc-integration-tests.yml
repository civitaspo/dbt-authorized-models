# Integration tests matrix (workflow_call). Called from workflow_call_pr.yml.

name: Integration tests (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  integration-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.1"
          install_args: "--locked"
          cache: false

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install unit test packages
        run: uv run dbt deps --project-dir unit_tests --profiles-dir unit_tests

      - name: Run unit tests
        run: uv run dbt run-operation run_unit_tests --project-dir unit_tests --profiles-dir unit_tests

      - name: Install integration test packages
        run: uv run dbt deps --project-dir integration_tests --profiles-dir integration_tests

      - name: Run authorization failure tests
        run: uv run python integration_tests/run_authorization_failure_tests.py

      - name: Assert dbt_project.yml source metadata
        run: uv run python integration_tests/assert_project_source_meta.py

      - name: Compile integration project
        run: uv run dbt compile --project-dir integration_tests --profiles-dir integration_tests
