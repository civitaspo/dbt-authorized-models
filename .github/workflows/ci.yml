# Single CI entrypoint (Shunsuke pattern).
# Required check: status-check (only). Real work lives in wc-* units.
# Title edits (`edited`) run pr-title only; open/sync/reopen run the full suite.
# Push/workflow_dispatch run tests without pr-title.

name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' && github.event.action == 'edited' && 'title'
      || 'full'
    }}
  cancel-in-progress: true

jobs:
  integration-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    uses: ./.github/workflows/wc-integration-tests.yml
    permissions:
      contents: read

  fusion-compatibility:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    uses: ./.github/workflows/wc-fusion-compatibility.yml
    permissions:
      contents: read

  lint:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    uses: ./.github/workflows/wc-lint.yml
    with:
      autofix: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read

  status-check:
    name: status-check
    if: always() && !cancelled() && github.event_name == 'pull_request'
    needs:
      - integration-tests
      - fusion-compatibility
      - lint
      - pr-title
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require checks success
        run: |
          set -euo pipefail
          ok() {
            local result="$1"
            local label="$2"
            echo "${label}: ${result}"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              exit 1
            fi
          }
          ok "${{ needs.integration-tests.result }}" "integration-tests"
          ok "${{ needs.fusion-compatibility.result }}" "fusion-compatibility"
          ok "${{ needs.lint.result }}" "lint"
          ok "${{ needs.pr-title.result }}" "pr-title"
