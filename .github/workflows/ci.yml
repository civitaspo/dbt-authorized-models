# Single pull_request entrypoint (Shunsuke pattern).
# Required check: status-check (only). Real work lives in workflow_call_pr.yml.

name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/workflow_call_pr.yml
    with:
      autofix: true
    secrets: inherit

  checks-push:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/workflow_call_pr.yml
    with:
      autofix: false
    secrets: inherit

  status-check:
    name: status-check
    if: always() && !cancelled() && github.event_name == 'pull_request'
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require checks success
        run: |
          set -euo pipefail
          result="${{ needs.checks.result }}"
          echo "checks result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
