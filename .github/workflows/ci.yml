# Outermost entry: event identification only.
# Which checks to run is decided inside workflow_call_pr.yml.

name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' && github.event.action == 'edited' && 'title'
      || 'full'
    }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/workflow_call_pr.yml
    with:
      autofix: ${{ github.event_name == 'pull_request' }}
      changed_title_only: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
    secrets: inherit

  status-check:
    name: status-check
    if: always() && !cancelled() && github.event_name == 'pull_request'
    needs:
      - checks
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require checks success
        run: |
          set -euo pipefail
          result="${{ needs.checks.result }}"
          echo "checks result: ${result}"
          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
