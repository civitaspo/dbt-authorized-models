# Single pull_request entrypoint (Shunsuke pattern).
# Required check: status-check (only). Real work lives in workflow_call_pr.yml.
# Title edits (`edited`) run title-only; open/sync/reopen run the full suite.

name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' && github.event.action == 'edited' && 'title'
      || 'full'
    }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    uses: ./.github/workflows/workflow_call_pr.yml
    with:
      autofix: true
      suite: full
    secrets: inherit

  title-only:
    if: github.event_name == 'pull_request' && github.event.action == 'edited'
    uses: ./.github/workflows/workflow_call_pr.yml
    with:
      autofix: true
      suite: title
    secrets: inherit

  checks-push:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/workflow_call_pr.yml
    with:
      autofix: false
      suite: full
    secrets: inherit

  status-check:
    name: status-check
    if: always() && !cancelled() && github.event_name == 'pull_request'
    needs:
      - checks
      - title-only
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require checks success
        run: |
          set -euo pipefail
          ok() {
            local result="$1"
            local label="$2"
            echo "${label}: ${result}"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              exit 1
            fi
          }
          ok "${{ needs.checks.result }}" "checks"
          ok "${{ needs.title-only.result }}" "title-only"
