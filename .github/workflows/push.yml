# Outermost push entry: bind push / workflow_dispatch only.
# Check-only (no SecureFix / no pr-title) lives in workflow_call_push.yml.

name: Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/workflow_call_push.yml
    permissions:
      contents: read

  status-check:
    name: status-check
    runs-on: ubuntu-latest
    if: always()
    needs:
      - checks
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful checks
        env:
          JOB_RESULT: ${{ needs.checks.result }}
        run: test "$JOB_RESULT" = success
