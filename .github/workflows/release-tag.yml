name: Release Tag

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Commit SHA to tag (defaults to main HEAD when empty)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-tag-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  tag:
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-tag.yml@ccb564da7e61d22e1718aecc85af05ac43383249
    with:
      merge_sha: ${{ inputs.merge_sha }}
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
