name: Release Tag

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Commit SHA to tag (defaults to main HEAD when empty)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-tag-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-tag.yml@76147712338365a3f6c0a72a1f283b3241f86917 # v0.1.1
    with:
      merge_sha: ${{ inputs.merge_sha }}
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
