name: Release PR

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version, or empty to compute it
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr.yml@1e2866cbab65c5ef4e218fa6853300c2731e73c0 # v0.2.33
    with:
      version: ${{ inputs.version }}
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
