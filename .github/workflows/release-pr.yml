name: Release PR

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version, or empty to compute it
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      attestations: read
      pull-requests: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr.yml@5b5eff3099d0285c2495fa6eaa0af91a6fe3de0e # v0.2.0-pre.2
    with:
      version: ${{ inputs.version }}
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
