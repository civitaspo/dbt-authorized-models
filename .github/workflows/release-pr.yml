name: Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    uses: civitaspo/securefix-server/.github/workflows/reusable-release-pr.yml@fbfe1e36ba343b0225dfe5681791799f75b02b96
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
