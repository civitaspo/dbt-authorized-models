# Reusable jobs for PR/push CI. Called from ci.yml.
# github.event_name is always workflow_call here — use inputs.autofix for PR vs push behavior.

name: PR checks (reusable)

on:
  workflow_call:
    inputs:
      autofix:
        description: "PR mode: apply autofixes via SecureFix. Push mode: check-only."
        type: boolean
        required: true
      suite:
        description: "full = all jobs; title = pr-title only (PR edited)."
        type: string
        required: true

permissions: {}

jobs:
  integration-tests:
    if: ${{ inputs.suite == 'full' }}
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.3"
          install_args: "--locked"
          cache: false

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install unit test packages
        run: uv run dbt deps --project-dir unit_tests --profiles-dir unit_tests

      - name: Run unit tests
        run: uv run dbt run-operation run_unit_tests --project-dir unit_tests --profiles-dir unit_tests

      - name: Install integration test packages
        run: uv run dbt deps --project-dir integration_tests --profiles-dir integration_tests

      - name: Run authorization failure tests
        run: uv run python integration_tests/run_authorization_failure_tests.py

      - name: Assert dbt_project.yml source metadata
        run: uv run python integration_tests/assert_project_source_meta.py

      - name: Compile integration project
        run: uv run dbt compile --project-dir integration_tests --profiles-dir integration_tests

  fusion-compatibility:
    if: ${{ inputs.suite == 'full' }}
    name: dbt Fusion compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.3"
          install_args: "--locked"
          cache: false

      - name: Install dbt Fusion
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-fusion-bin"
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh \
            | sh -s -- --to "$RUNNER_TEMP/dbt-fusion-bin" --update
          "$RUNNER_TEMP/dbt-fusion-bin/dbt" --version

      - name: Install unit test packages
        run: |
          "$RUNNER_TEMP/dbt-fusion-bin/dbt" deps --project-dir unit_tests --profiles-dir unit_tests

      - name: Run unit tests
        run: |
          "$RUNNER_TEMP/dbt-fusion-bin/dbt" run-operation run_unit_tests --project-dir unit_tests --profiles-dir unit_tests

      - name: Install integration test packages
        run: |
          "$RUNNER_TEMP/dbt-fusion-bin/dbt" deps --project-dir integration_tests --profiles-dir integration_tests

      - name: Parse integration project
        run: |
          "$RUNNER_TEMP/dbt-fusion-bin/dbt" parse --project-dir integration_tests --profiles-dir integration_tests

      - name: Run authorization failure tests
        run: |
          uv run python integration_tests/run_authorization_failure_tests.py --dbt-executable "$RUNNER_TEMP/dbt-fusion-bin/dbt"

      - name: Assert dbt_project.yml source metadata
        run: |
          uv run python integration_tests/assert_project_source_meta.py --dbt-executable "$RUNNER_TEMP/dbt-fusion-bin/dbt"

      - name: Compile integration project
        run: |
          "$RUNNER_TEMP/dbt-fusion-bin/dbt" compile --project-dir integration_tests --profiles-dir integration_tests

  lint:
    if: ${{ inputs.suite == 'full' }}
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      SECUREFIX_CLIENT_APP_ID: ${{ vars.SECUREFIX_CLIENT_APP_ID }}
      SECUREFIX_SERVER_REPOSITORY: ${{ vars.SECUREFIX_SERVER_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid CHANGELOG edits outside release/next
        if: inputs.autofix && github.head_ref != 'release/next'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "${base}...${head}" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is owned by the Release PR (git-cliff)." >&2
            echo "Do not edit it on feature PRs; use Conventional Commit subjects instead." >&2
            echo "See docs/releasing.md." >&2
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.3"
          install_args: "--locked"
          cache: false

      - name: Fix action pins
        if: inputs.autofix
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --verify-comment

      - name: Check action pins
        if: ${{ !inputs.autofix }}
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment

      - name: Disable checkout credentials
        if: inputs.autofix
        run: disable-checkout-persist-credentials

      - name: Ensure checkout credentials are disabled
        if: ${{ !inputs.autofix }}
        run: |
          disable-checkout-persist-credentials
          git diff --exit-code -- .github/workflows

      - name: ShellCheck release scripts
        if: hashFiles('scripts/**/*.sh') != ''
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Run ghalint
        run: ghalint run

      - name: Detect workflow fixes
        if: inputs.autofix
        id: workflow-fixes
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only -- .github/workflows

      - name: Request SecureFix commit
        if: |
          inputs.autofix &&
          steps.workflow-fixes.outputs.changed == 'true' &&
          env.SECUREFIX_CLIENT_APP_ID != ''
        uses: csm-actions/securefix-action@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: client
          app_id: ${{ env.SECUREFIX_CLIENT_APP_ID }}
          app_private_key: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
          commit_message: "ci: apply workflow security fixes"
          server_repository: ${{ env.SECUREFIX_SERVER_REPOSITORY }}

      - name: Require SecureFix configuration
        if: |
          inputs.autofix &&
          steps.workflow-fixes.outputs.changed == 'true' &&
          env.SECUREFIX_CLIENT_APP_ID == ''
        run: |
          echo "Workflow security fixes are needed, but SECUREFIX_CLIENT_APP_ID is not configured." >&2
          exit 1

      - name: Check workflow formatting
        if: ${{ !inputs.autofix }}
        run: git diff --exit-code -- .github/workflows

  pr-title:
    if: ${{ inputs.autofix && (inputs.suite == 'full' || inputs.suite == 'title') }}
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5

    steps:
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
            revert
          requireScope: false
