# Aggregator for PR/push CI. Called from ci.yml; delegates to wc-* units.
# github.event_name is always workflow_call here — use inputs.autofix for PR vs push behavior.

name: PR checks (workflow_call)

on:
  workflow_call:
    inputs:
      autofix:
        description: "PR mode: apply autofixes via SecureFix. Push mode: check-only."
        type: boolean
        required: true
      suite:
        description: "full = all jobs; title = pr-title only (PR edited)."
        type: string
        required: true

permissions: {}

jobs:
  integration-tests:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-integration-tests.yml
    permissions:
      contents: read

  fusion-compatibility:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-fusion-compatibility.yml
    permissions:
      contents: read

  lint:
    if: ${{ inputs.suite == 'full' }}
    uses: ./.github/workflows/wc-lint.yml
    with:
      autofix: ${{ inputs.autofix }}
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    if: ${{ inputs.autofix && (inputs.suite == 'full' || inputs.suite == 'title') }}
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read
