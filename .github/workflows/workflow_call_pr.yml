# PR aggregator: fans out to wc-* units.
# Assumes caller is a pull_request workflow.

name: PR checks (workflow_call)

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  integration-tests:
    uses: ./.github/workflows/wc-integration-tests.yml
    permissions:
      contents: read

  fusion-compatibility:
    uses: ./.github/workflows/wc-fusion-compatibility.yml
    permissions:
      contents: read

  autofix:
    uses: ./.github/workflows/wc-autofix.yml
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      actions: read
      attestations: read

  pr-title:
    uses: ./.github/workflows/wc-pr-title.yml
    permissions:
      pull-requests: read
