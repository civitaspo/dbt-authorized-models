name: Merge Request

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: merge-request-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/merge') &&
      (github.event.comment.user.id == 4525500 ||
       (github.event.comment.user.id == 29139614 &&
        github.event.comment.user.type == 'Bot' &&
        github.event.issue.user.id == 29139614)) &&
      github.run_attempt == 1
    permissions:
      actions: read
      contents: read
      attestations: read
      issues: read
      pull-requests: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-merge-request.yml@bf66565ea834e0fe528f4655806335740afd3348 # v0.2.46
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
