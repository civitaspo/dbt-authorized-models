name: Merge Request

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: merge-request-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/merge') &&
      (github.event.comment.user.id == 4525500 ||
       (github.event.comment.user.id == 29139614 &&
        github.event.comment.user.type == 'Bot' &&
        github.event.issue.user.id == 29139614)) &&
      github.run_attempt == 1
    permissions:
      actions: read
      contents: read
      attestations: read
      issues: write
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-merge-request.yml@1e2866cbab65c5ef4e218fa6853300c2731e73c0 # v0.2.33
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
