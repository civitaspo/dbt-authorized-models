name: Approve Request

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: approve-request-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.comment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    permissions:
      contents: read
      attestations: read
      issues: write
      pull-requests: write
    uses: civitaspo/securefix-server/.github/workflows/reusable-approve-request.yml@049293a67b703678ed78ee19c048e9ac5fed9cc3 # v0.2.6
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
