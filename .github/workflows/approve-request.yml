name: Approve Request

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: approve-request-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    permissions:
      contents: read
      attestations: read
      issues: read
      pull-requests: read
    uses: civitaspo/securefix-server/.github/workflows/reusable-approve-request.yml@5b5eff3099d0285c2495fa6eaa0af91a6fe3de0e # v0.2.0-pre.2
    secrets:
      SECUREFIX_CLIENT_PRIVATE_KEY: ${{ secrets.SECUREFIX_CLIENT_PRIVATE_KEY }}
