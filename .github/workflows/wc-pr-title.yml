# PR title validation (workflow_call). Called from workflow_call_pr.yml.

name: PR title (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5

    steps:
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          headerPattern: '^(\w+|release-pr)(?:\((.*)\))?!?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
            revert
            ${{ github.head_ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository && 'release-pr' || '' }}
          requireScope: false
