# PR title validation (workflow_call). Called from workflow_call_pr.yml.

name: PR title (workflow_call)

on:
  workflow_call:

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5

    steps:
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            chore
            perf
            revert
          requireScope: false
