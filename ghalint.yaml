# Common callers and release publication inherit the Client App key.
excludes:
  - policy_name: deny_inherit_secrets
    workflow_file_path: .github/workflows/csm-ci-approve.yml
    job_name: request
  - policy_name: deny_inherit_secrets
    workflow_file_path: .github/workflows/csm-ci-policy-check.yml
    job_name: request
  - policy_name: deny_inherit_secrets
    workflow_file_path: .github/workflows/csm-ci-merge.yml
    job_name: request
  - policy_name: deny_inherit_secrets
    workflow_file_path: .github/workflows/csm-ci-release.yml
    job_name: release
